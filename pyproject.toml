[project]
name = "kavach"
version = "0.1.0"
description = "Prompt-injection firewall for AI agents, for English, Hindi, Hinglish and Marathi"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "scikit-learn", "pandas", "joblib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kavach"]
